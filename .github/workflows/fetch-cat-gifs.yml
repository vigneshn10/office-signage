name: Fetch cat GIFs

# Collects GIF links from the Tenor search https://tenor.com/en-GB/search/cat-gifs into
# data/catgifs.json (links only, no GIFs are copied). The screen shows a random one each
# lap. If this job fails, the screen keeps using the last list (or skips that screen).

on:
  schedule:
    - cron: '41 12 * * *'   # 5:41 AM Phoenix, before the office opens
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-cat-gifs.yml', 'scripts/fetch_cat_gifs.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-cat-gifs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect cat GIFs
        run: python3 scripts/fetch_cat_gifs.py data/catgifs.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catgifs.json
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -m "Cat GIFs: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull --rebase --quiet origin "$GITHUB_REF_NAME" && git push --quiet origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::error::Could not push data/catgifs.json"
          exit 1
