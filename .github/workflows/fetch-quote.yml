name: Fetch quote of the day

# Pulls BrainyQuote's "Funny Quote" RSS feed (the official feed linked from
# https://www.brainyquote.com/feeds/funny) and commits data/quote.json.
# To go back to the regular quote of the day, set FEED_URL to
# https://www.brainyquote.com/link/quotebr.rss
# The page renders its own card from that JSON; if this job fails, app.js
# falls back to its built-in quote list, so the screen never breaks.

on:
  schedule:
    # The feed rolls over at 05:00 UTC. 07:23 UTC = 12:23 AM in Phoenix (no DST).
    - cron: '23 7 * * *'
    # Second attempt at 6:23 AM Phoenix in case the first run failed or was skipped.
    - cron: '23 13 * * *'
  # Also run right away whenever this file is changed (e.g. a new FEED_URL).
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-quote.yml']
  workflow_dispatch:

permissions:
  contents: write   # commit data/quote.json
  pages: write      # request a Pages rebuild after the commit

concurrency:
  group: fetch-quote
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and parse today's quote
        env:
          FEED_URL: https://www.brainyquote.com/link/quotebr.rss
        run: |
          python3 - <<'PY'
          import html, json, os, sys, time, urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime

          url = os.environ["FEED_URL"]
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                            "(KHTML, like Gecko) Chrome/126.0 Safari/537.36",
              "Accept": "application/rss+xml, application/xml;q=0.9, */*;q=0.8",
          })

          raw, err = None, None
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      raw = r.read()
                  break
              except Exception as e:
                  err = e
                  time.sleep(5 * (attempt + 1))
          if raw is None:
              print(f"::error::Could not download the feed: {err}")
              sys.exit(1)

          try:
              item = ET.fromstring(raw).find("./channel/item")   # first item = today's quote
          except ET.ParseError as e:
              print(f"::error::Feed is not valid XML: {e}")
              sys.exit(1)
          if item is None:
              print("::error::Feed has no <item>")
              sys.exit(1)

          def field(tag):
              el = item.find(tag)
              return html.unescape((el.text or "").strip()) if el is not None else ""

          author = field("title")                          # feed puts the author in <title>
          text = field("description").strip().strip('"“”').strip()
          link = field("link")
          if not text or not author or len(text) > 600:
              print(f"::error::Unexpected feed content: author={author!r} text={text[:80]!r}")
              sys.exit(1)

          try:
              day = parsedate_to_datetime(field("pubDate")).astimezone(timezone.utc).date()
          except Exception:
              day = datetime.now(timezone(timedelta(hours=-7))).date()   # Phoenix

          path = "data/quote.json"
          try:
              with open(path, encoding="utf-8") as f:
                  old = json.load(f)
          except Exception:
              old = {}
          if old.get("date") == day.isoformat() and old.get("text") == text and old.get("author") == author:
              print("Quote unchanged.")
              sys.exit(0)

          data = {
              "date": day.isoformat(),
              "text": text,
              "author": author,
              "link": link,
              "source": "BrainyQuote",
              "fetchedAt": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
          }
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"{day}: “{text}” — {author}")
          PY

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quote.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Quote of the day: $(python3 -c 'import json;print(json.load(open("data/quote.json"))["date"])')"
          # The Google Form may commit at the same moment: rebase and retry.
          for i in 1 2 3; do
            if git pull --rebase --quiet origin "$GITHUB_REF_NAME" && git push --quiet origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::Could not push data/quote.json"
          exit 1

      - name: Ask GitHub Pages to rebuild
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Belt and braces: the push normally triggers a Pages build on its own.
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent \
            || echo "::warning::Pages build request failed; the push itself usually triggers one."
